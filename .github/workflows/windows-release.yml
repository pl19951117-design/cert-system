name: Windows installer release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/windows-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npx tsc --noEmit
      - name: Build Windows x64 installer
        run: npm run dist -- --publish never
      - name: Check packaged Windows runtime and attachments
        run: node scripts/smoke-windows-bundle.mjs
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Installer was not generated' }
          $asset = "release/cert-system-setup-$version.exe"
          Move-Item -LiteralPath $installer.FullName -Destination $asset
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLower()
          "$hash  cert-system-setup-$version.exe" | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          gh release create "v$version" $asset release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "证件管理系统 v$version" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
